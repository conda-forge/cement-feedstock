{% set name = "cement" %}
{% set version = "3.0.16" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7b56202c3c254dcf64aacdb6b3275a8fe08f50aac8a6c082d30d7860d490378e

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - cement = cement.cli.main:main


requirements:
  host:
    - python {{ python_min }}
    - pip
    - pdm
    - pdm-backend

  run:
    - python >={{ python_min }}

test:
  imports:
    - cement
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://builtoncement.com
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD
  summary: CLI Application Framework for Python
  doc_url: http://builtoncement.com/2.6/
  dev_url: https://github.com/datafolklabs/cement

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen
